[project]
name = "llm-wiki-ingest-tools"
version = "0.1.0"
description = "Downloaders that pull source material into the LLM Wiki raw/ layer."
requires-python = ">=3.12"
dependencies = [
    # YouTube subtitle downloaders (download_channel_*.py, download_playlists_*.py)
    "yt-dlp>=2026.6.9",
    # PO-token / JS-runtime support for the authed YouTube path
    "bgutil-ytdlp-pot-provider>=1.3.1",
    "yt-dlp-ejs>=0.8.0",
    # Blog HTML -> markdown extraction (download_blog.py)
    "trafilatura>=2.1.0",
]

[tool.setuptools]
# Flat layout: the scripts are top-level modules, not a package.
py-modules = [
    "_channel_core",
    "vtt_to_md",
    "download_blog",
    "download_channel_authed",
    "download_channel_public",
    "download_playlists_auth",
    "download_playlists_public",
]
